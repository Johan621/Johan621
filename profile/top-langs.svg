<svg
  viewBox="0 0 300 165"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
  preserveAspectRatio="xMidYMid meet"
  style="width:100%;max-width:300px;height:auto;display:block;"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Language usage statistics</desc>

  <style>
    .header {
      font-family: "Segoe UI", Ubuntu, Sans-Serif;
      font-size: clamp(14px, 4vw, 18px);
      font-weight: 600;
      fill: #58A6FF;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }

    .lang-name {
      font-family: "Segoe UI", Ubuntu, Sans-Serif;
      font-size: clamp(9px, 2.5vw, 11px);
      fill: #C3D1D9;
    }

    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }

    .lang-progress {
      transform-origin: left center;
      animation: growWidthAnimation 0.8s ease-in-out forwards;
    }

    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }

    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: 250px;
      }
    }

    @keyframes growWidthAnimation {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>

  <!-- Background -->
  <rect
    x="0.5"
    y="0.5"
    width="299"
    height="164"
    rx="4.5"
    fill="#0D1117"
  />

  <!-- Title -->
  <g transform="translate(25,35)">
    <text class="header">Most Used Languages</text>
  </g>

  <!-- Progress Bar -->
  <g transform="translate(25,55)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="250" height="8" rx="5" fill="white" />
    </mask>

    <!-- Total width = 250 -->

    <rect
      class="lang-progress"
      mask="url(#rect-mask)"
      x="0"
      y="0"
      width="223.3"
      height="8"
      fill="#3572A5"
    />

    <rect
      class="lang-progress"
      mask="url(#rect-mask)"
      x="223.3"
      y="0"
      width="11.3"
      height="8"
      fill="#f34b7d"
    />

    <rect
      class="lang-progress"
      mask="url(#rect-mask)"
      x="234.6"
      y="0"
      width="8.9"
      height="8"
      fill="#fedf5b"
    />

    <rect
      class="lang-progress"
      mask="url(#rect-mask)"
      x="243.5"
      y="0"
      width="3.7"
      height="8"
      fill="#DA5B0B"
    />

    <rect
      class="lang-progress"
      mask="url(#rect-mask)"
      x="247.2"
      y="0"
      width="1.7"
      height="8"
      fill="#555555"
    />

    <rect
      class="lang-progress"
      mask="url(#rect-mask)"
      x="248.9"
      y="0"
      width="1.1"
      height="8"
      fill="#3178c6"
    />

    <!-- Language Labels -->
    <g transform="translate(0,25)">
      <g class="stagger" style="animation-delay:450ms">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text x="15" y="10" class="lang-name">Python 89.32%</text>
      </g>

      <g transform="translate(0,25)" class="stagger" style="animation-delay:600ms">
        <circle cx="5" cy="6" r="5" fill="#f34b7d" />
        <text x="15" y="10" class="lang-name">C++ 4.50%</text>
      </g>

      <g transform="translate(0,50)" class="stagger" style="animation-delay:750ms">
        <circle cx="5" cy="6" r="5" fill="#fedf5b" />
        <text x="15" y="10" class="lang-name">Cython 3.54%</text>
      </g>

      <g transform="translate(150,0)" class="stagger" style="animation-delay:450ms">
        <circle cx="5" cy="6" r="5" fill="#DA5B0B" />
        <text x="15" y="10" class="lang-name">Jupyter Notebook 1.46%</text>
      </g>

      <g transform="translate(150,25)" class="stagger" style="animation-delay:600ms">
        <circle cx="5" cy="6" r="5" fill="#555555" />
        <text x="15" y="10" class="lang-name">C 0.69%</text>
      </g>

      <g transform="translate(150,50)" class="stagger" style="animation-delay:750ms">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text x="15" y="10" class="lang-name">TypeScript 0.49%</text>
      </g>
    </g>
  </g>
</svg>
